version: "4"

services:
  db:
    image: mongo:8.0.5
    restart: always
    networks:
      - app_networks
    volumes:
      - db-data:/data/db

  init-permission:
    image: alpine:3.18
    volumes:
      - ./esdata:/mnt/data
    command: >
      sh -c "mkdir -p /mnt/data && chmod 777 /mnt/data"
    entrypoint: /bin/sh
    restart: "no"
  es:
    image: dnatracker-es:2.2.0
    container_name: es
    user: "1000:1000"  # Đảm bảo user phù hợp với UID của elasticsearch trong container
    networks:
      - app_networks
    volumes:
      - es-data:/usr/share/elasticsearch/data
      - ./eslogs:/opt/elasticsearch/logs
      - ./esplugins:/opt/elasticsearch/plugins
      - ./esconfig:/opt/elasticsearch/config
    environment:
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    depends_on:
      - init-permission

  web:
    image: dnatracker-web:2.0.1
    restart: always
    ports:
      - 8480:3000
    environment:
      - MONGODB_URI=mongodb://db:27017/test
      - ES_HOST=es:9200
    networks:
      - app_networks
    depends_on:
      - db
      - es

  restore-es:
    image: dnatracker-web:2.0.1
    command: bash -c "cd tasks && \
      gulp create-mapping-es && \
      gulp create-db-from-backup && \
      gulp create-mock-db-users && \
      gulp update-species-images"
    environment:
      - MONGODB_URI=mongodb://db/dna-tracker
      - ES_HOST=es:9200
    networks:
      - app_networks
    depends_on:
      - es
      - db
    profiles:
      - restore

volumes:
  db-data:
    driver: local
  es-data:
    driver: local

networks:
  app_networks:
