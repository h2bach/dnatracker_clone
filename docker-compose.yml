services:
  mongodb:
    image: mongo:5.0
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
      - ./backup:/backup
    environment:
      MONGO_INITDB_DATABASE: test
    command: mongod --noauth --bind_ip_all
    # healthcheck:
    #   test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 5
    #   start_period: 60s
    networks:
      - dnatracker_network

  elasticsearch:
    build:
      context: ./docker/elasticsearch
      dockerfile: Dockerfile
    restart: always
    ports:
      - "9200:9200"
      - "9200:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./eslogs:/usr/share/elasticsearch/logs
    environment:
      - cluster.name=dnatracker-cluster
      - node.name=dnatracker-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - network.host=0.0.0.0
    networks:
      - dnatracker_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  dnatracker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8480:3000"
    volumes:
      - ./uploads:/app/uploads
      - ./tmp:/app/tmp
      - ./db:/app/db
      - ./backup:/app/backup
      - ./eslogs:/app/eslogs
    environment:
      - NODE_ENV=dev
      - MONGODB_URI=mongodb://mongodb:27017/test
      - ELASTICSEARCH_HOST=elasticsearch:9200
      - BLASTDB=/app/db
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - dnatracker_network

  # Service để khôi phục dữ liệu (chạy một lần)
  restore-data:
    build: .
    volumes:
      - ./uploads:/app/uploads
      - ./tmp:/app/tmp
      - ./db:/app/db
      - ./backup:/app/backup
      - ./eslogs:/app/eslogs
    environment:
      - NODE_ENV=dev
      - MONGODB_URI=mongodb://mongodb:27017/test
      - ELASTICSEARCH_HOST=elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - dnatracker_network
    profiles:
      - restore
    entrypoint: ["/usr/local/bin/restore-data.sh"]

volumes:
  mongodb_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  dnatracker_network:
    driver: bridge
