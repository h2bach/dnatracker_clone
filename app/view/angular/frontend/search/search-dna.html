<div class="back-btn">
    <a class="btn btn-primary btn-x2 page-scroll" ui-sref="frontend.home"><i class="fa fa-arrow-left"></i> Về Trang Chủ</a>
</div>
<login-btn></login-btn>
<header style="background-image: url(assets/img/Male_Barn_Owl.jpg); height: 100%;">
    <div class="header-content overlay"></div>
    <div class="header-content">
        <div class="header-content-inner">
            <h1><strong>Biodiversity Vietnam</strong></h1>
            <h2>Trang web nhận dạng các loài động vật có xương sống quý hiếm</h2>
            <h2>được bảo vệ tại Việt Nam</h2>
            <hr style="max-width: 200px;">
            <div class="row" ng-if="!view.searching">
                <div class="col-sm-4 col-sm-offset-2 m-b-md">
                    <div class="input-group-lg">
                        <input ng-disabled="input.file" type="text" class="form-control" ng-model="input.title" placeholder="Tên chuỗi (hoặc thông tin chuỗi)"/>
                    </div>
                </div>
                <div class="col-sm-4 m-b-md">
                    <div class="input-group-lg">
                        <select class="form-control" ng-model="input.typeGen">
                            <option value="">Chọn một loại gen</option>
                            <option value="COI">COI</option>
                            <option value="Cytochrome B">Cytochrome B</option>
                            <option value="12S">12S</option>
                            <option value="16S">16S</option>
                            <option value="18S">18S</option>
                            <option value="28S">28S</option>
                            <option value="ND2">ND2</option>
                            <option value="ND4">ND4</option>
                            <option value="R35">R35</option>
                            <option value="Rag1">Rag1</option>
                        </select>
                    </div>
                </div>
                <div class="col-sm-8 col-sm-offset-2 m-b-md">
                    <div class="input-group-lg">
                        <input ng-disabled="input.file" type="text" class="form-control" ng-model="input.text" placeholder="Nhập chuỗi DNA"/>
                    </div>
                </div>
                <div class="col-sm-8 col-sm-offset-2 col-xs-10 col-xs-offset-1 list-button" style="margin-bottom: -10px; display: flex; gap: 20px;">
                    <div style="flex:1;">
                        <file-input-form ng-model="input.file" title="Hoặc chọn file (.txt, .fa, .fasta)" style="width:100%; height: 48px;"></file-input-form>
                    </div>
                    <a href="assets/sample-cytoB.fasta" download class="btn btn-success btn-xl" style="width: 180px; min-width: 120px; max-width: 220px; display: flex; align-items: center; justify-content: center; height: 48px;">
                        <i class="fa fa-download"></i> <span style="margin-left:8px;">Tải mẫu FASTA</span>
                    </a>
                </div>
                <div class="col-sm-8 col-sm-offset-2 col-xs-10 col-xs-offset-1 list-button" style="margin-top: 15px;">
                    <button class="btn btn-primary btn-xl" ng-click="search('blast')" ng-disabled="isDisabled()"><i class="fa fa-search"></i> Blast</button>
                    <button class="btn btn-warning btn-xl" ng-click="search('maximum_likelihood')" ng-disabled="isDisabled()"><i class="fa fa-search"></i> IQTREE</button>
                </div>
            </div>
            <div class="row" ng-if="view.searching">
                <h3>Đang tìm kiếm</h3>
                <img ng-src="assets/img/loading-spin.svg" style="width: 60px; height: 60px;" alt=""/>
            </div>
        </div>
    </div>
</header>
